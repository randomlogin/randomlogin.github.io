<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1000" viewBox="-30 -20 520 1000" role="img" aria-labelledby="t d">
  <title id="t">Data flow of the compact block filter chain source in ldk-node</title>
  <desc id="d">Peers in the Bitcoin network feed the kyoto node. The kyoto node sends events to the kyoto client and receives requests from it. The client streams kyoto events to process_kyoto_events, which asks the client to fetch matching blocks and sends ChainOp values to BlockApplicator. BlockApplicator calls the Listen methods of ChainListener, which fans out to the BDK wallet, ChannelManager, ChainMonitor and OutputSweeper. The kyoto node and client are drawn inside a dashed region labelled kyoto, which sits inside a dashed region labelled ldk-node.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #222; }
    .mono { font-family: ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .muted { fill: #666; }
    .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
    .edge { stroke: #222; stroke-width: 1.5; fill: none; }
    .net { stroke: #b5b5b5; stroke-width: 1.2; }
    .zone { fill: #fafafa; stroke: #888; stroke-width: 1.5; stroke-dasharray: 8 6; }
    .zone-inner { fill: #f0f0f0; }
    .zone-label { font-size: 13px; font-weight: 600; fill: #555; letter-spacing: 0.02em; }
  </style>

  <rect x="-30" y="-20" width="520" height="1000" fill="#fff"/>

  <!-- zones: drawn first so the connections and boxes sit on top of their fills -->
  <rect x="4" y="235" width="452" height="715" rx="28" class="zone"/>
  <text x="444" y="257" text-anchor="end" class="zone-label">ldk-node</text>
  <rect x="110" y="258" width="260" height="222" rx="20" class="zone zone-inner"/>
  <text x="122" y="278" class="zone-label">kyoto</text>

  <!-- Bitcoin network: edges run off the frame, i.e. on to the rest of the network -->
  <g class="net">
    <!-- links between known nodes -->
    <line x1="140" y1="60" x2="270" y2="50"/>
    <line x1="270" y1="50" x2="380" y2="95"/>
    <line x1="140" y1="60" x2="70" y2="125"/>
    <line x1="140" y1="60" x2="230" y2="115"/>
    <line x1="270" y1="50" x2="230" y2="115"/>
    <line x1="380" y1="95" x2="230" y2="115"/>
    <line x1="70" y1="125" x2="180" y2="185"/>
    <line x1="230" y1="115" x2="180" y2="185"/>
    <line x1="230" y1="115" x2="305" y2="180"/>
    <line x1="380" y1="95" x2="305" y2="180"/>
    <!-- links continuing to the rest of the network -->
    <line x1="140" y1="60" x2="89" y2="-20"/>
    <line x1="140" y1="60" x2="-30" y2="20"/>
    <line x1="270" y1="50" x2="252" y2="-20"/>
    <line x1="270" y1="50" x2="340" y2="-20"/>
    <line x1="380" y1="95" x2="490" y2="40"/>
    <line x1="380" y1="95" x2="490" y2="150"/>
    <line x1="70" y1="125" x2="-30" y2="88"/>
    <line x1="70" y1="125" x2="-30" y2="181"/>
  </g>
  <g fill="#fff" stroke="#777" stroke-width="1.5">
    <circle cx="140" cy="60" r="9"/>
    <circle cx="270" cy="50" r="9"/>
    <circle cx="380" cy="95" r="9"/>
    <circle cx="70" cy="125" r="9"/>
    <circle cx="230" cy="115" r="9"/>
  </g>
  <!-- fade the outgoing links into the page -->
  <rect x="-30" y="-20" width="520" height="60" fill="url(#fadeT)"/>
  <rect x="-30" y="-20" width="80" height="235" fill="url(#fadeL)"/>
  <rect x="410" y="-20" width="80" height="235" fill="url(#fadeR)"/>
  <text x="480" y="10" text-anchor="end" font-size="13" font-weight="600" class="muted">Bitcoin network</text>

  <!-- peers kyoto is connected to -->
  <line x1="180" y1="185" x2="200" y2="285" class="edge"/>
  <line x1="305" y1="180" x2="280" y2="285" class="edge"/>
  <g fill="#222" stroke="#222" stroke-width="1.5">
    <circle cx="180" cy="185" r="9"/>
    <circle cx="305" cy="180" r="9"/>
  </g>

  <!-- kyoto node / client -->
  <rect x="150" y="285" width="180" height="56" rx="6" class="box"/>
  <text x="240" y="308" text-anchor="middle" font-size="16" font-weight="600">kyoto node</text>
  <text x="240" y="327" text-anchor="middle" font-size="11.5" class="muted">p2p · headers · filters</text>

  <line x1="200" y1="341" x2="200" y2="400" class="edge" marker-end="url(#arr)"/>
  <text x="192" y="376" text-anchor="end" font-size="12" class="muted">events</text>
  <line x1="280" y1="400" x2="280" y2="341" class="edge" marker-end="url(#arr)"/>
  <text x="288" y="376" font-size="12" class="muted">requests</text>

  <rect x="150" y="400" width="180" height="56" rx="6" class="box"/>
  <text x="240" y="423" text-anchor="middle" font-size="16" font-weight="600">kyoto client</text>
  <text x="240" y="442" text-anchor="middle" font-size="11.5" class="muted">event stream · requester</text>

  <!-- kyoto events -->
  <line x1="240" y1="456" x2="240" y2="552" class="edge" marker-end="url(#arr)"/>
  <text x="252" y="496" font-size="13" font-weight="600">kyoto events</text>
  <text x="252" y="512" font-size="11.5" class="mono muted">IndexedFilter</text>
  <text x="252" y="527" font-size="11.5" class="mono muted">ChainUpdate</text>
  <text x="252" y="542" font-size="11.5" class="mono muted">FiltersSynced</text>

  <!-- process_kyoto_events -->
  <rect x="130" y="552" width="220" height="52" rx="26" class="box"/>
  <text x="240" y="583" text-anchor="middle" font-size="12.5" class="mono">process_kyoto_events</text>

  <!-- fetch block loop -->
  <path d="M130,578 C48,578 48,428 150,428" class="edge" marker-end="url(#arr)"/>
  <text x="64" y="505" text-anchor="end" font-size="13" font-weight="600">fetch</text>
  <text x="64" y="520" text-anchor="end" font-size="13" font-weight="600">block</text>
  <text x="64" y="535" text-anchor="end" font-size="11" class="muted">on match</text>

  <!-- ChainOp -->
  <line x1="240" y1="604" x2="240" y2="690" class="edge" marker-end="url(#arr)"/>
  <text x="252" y="651" font-size="13" font-weight="600" class="mono">ChainOp</text>

  <!-- BlockApplicator -->
  <rect x="150" y="690" width="180" height="70" rx="6" class="box"/>
  <text x="240" y="721" text-anchor="middle" font-size="16" font-weight="600">BlockApplicator</text>
  <text x="240" y="742" text-anchor="middle" font-size="11.5" class="muted">applies ops in order</text>

  <!-- Listen callbacks -->
  <line x1="240" y1="760" x2="240" y2="850" class="edge" marker-end="url(#arr)"/>
  <text x="252" y="794" font-size="13" font-weight="600">Listen</text>
  <text x="252" y="810" font-size="11.5" class="mono muted">block_connected</text>
  <text x="252" y="825" font-size="11.5" class="mono muted">filtered_block_connected</text>
  <text x="252" y="840" font-size="11.5" class="mono muted">blocks_disconnected</text>

  <!-- ChainListener -->
  <rect x="110" y="850" width="260" height="76" rx="6" class="box"/>
  <text x="240" y="881" text-anchor="middle" font-size="16" font-weight="600">ChainListener</text>
  <text x="240" y="901" text-anchor="middle" font-size="11.5" class="muted">BDK wallet · ChannelManager</text>
  <text x="240" y="916" text-anchor="middle" font-size="11.5" class="muted">ChainMonitor · OutputSweeper</text>
</svg>
